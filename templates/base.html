<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ course.title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">{{ course.title }}</a>
      <nav>
        <a href="{{ url_for('course.catalogue') }}">Modules</a>
        <a href="{{ url_for('index') }}#enroll">Enrol</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap">
    <p>{{ course.title }} · Microsoft Agent Framework · course in progress</p>
  </footer>
</body>
</html>
